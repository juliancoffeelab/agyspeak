[project]
name = "agyspeak"
version = "0.1.0"
description = "Terminal voice chat with Gemini through the Antigravity CLI (agy)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "kokoro @ git+https://github.com/hexgrad/kokoro@4b647d371e837e1f6e356bbbabc99b0c436f27bd",
    "markdown-it-py>=4.0.0",
    "mcp>=2.2.0",
    "mdit-py-plugins>=0.5.0",
    "mlx-audio>=0.5.4",
    "numpy>=2.5.3",
    "prompt-toolkit>=3.0.53",
    "pylatexenc>=2.11",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
agyspeak = "agyspeak.cli:app"
agyspeak-mcp = "agyspeak.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agyspeak"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Misaki declares this optional spaCy transformer plugin, but its English G2P
# uses en_core_web_sm with trf=False. Loading the unused plugin invokes the
# deprecated TorchScript path on every Kokoro startup.
exclude-dependencies = ["spacy-curated-transformers"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
